<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 220" width="180" height="220" fill="none">
  <defs>
    <!-- Silver Metallic Gradients -->
    <linearGradient id="silver-ring-outer" x1="30" y1="55" x2="150" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#DCE4EE" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="silver-ring-inner" x1="150" y1="175" x2="30" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#7B8B9E" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="silver-crown" x1="65" y1="18" x2="115" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="45%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#7B8B9E" />
    </linearGradient>

    <linearGradient id="silver-badge" x1="70" y1="154" x2="110" y2="198" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#D5DEE9" />
      <stop offset="100%" stop-color="#8C9BB0" />
    </linearGradient>

    <filter id="silver-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#475569" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Crown -->
  <g filter="url(#silver-shadow)">
    <path d="M70 49 L65 29 L80 38 L90 23 L100 38 L115 29 L110 49 C99 51.5, 81 51.5, 70 49 Z" fill="url(#silver-crown)" />
    <circle cx="64.5" cy="27.5" r="2.8" fill="#F1F5F9" />
    <circle cx="90" cy="21.5" r="3.4" fill="#FFFFFF" />
    <circle cx="115.5" cy="27.5" r="2.8" fill="#CBD5E1" />
    <path d="M71 48 C81 50, 99 50, 109 48" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" />
  </g>

  <!-- Main Circular Frame (Transparent Center) -->
  <g filter="url(#silver-shadow)">
    <circle cx="90" cy="115" r="54" stroke="url(#silver-ring-outer)" stroke-width="8.5" />
    <circle cx="90" cy="115" r="50.5" stroke="url(#silver-ring-inner)" stroke-width="2" />
  </g>

  <!-- Bottom Rank Badge -->
  <g filter="url(#silver-shadow)">
    <circle cx="90" cy="174" r="20" fill="url(#silver-badge)" stroke="#F8FAFC" stroke-width="2" />
    <!-- Remove <text> if you want a blank badge -->
    <text x="90" y="182" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="800" fill="#1E293B">2</text>
  </g>
</svg>