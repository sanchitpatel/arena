<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BMIIL Incubation Lab · Arena</title>
<style>
:root{--ink:#0d0d0d;--mist:#f1f5f9;--sky:#38bdf8;--gold:#c8922a;--gold-hi:#f3c969;--text:#0f172a;--mute:#64748b}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);
  background:radial-gradient(120% 60% at 50% 0%,#e0f2fe 0%,var(--mist) 55%,#eef2f7 100%);
  display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
.card{width:100%;max-width:380px;text-align:center;padding:36px 26px 26px;border-radius:36px;
  background:linear-gradient(160deg,#f8fafc,#e9eef5);
  box-shadow:0 24px 50px rgba(30,64,120,.14),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(148,163,184,.25)}
.orb{position:relative;width:176px;height:176px;margin:0 auto 22px;border-radius:50%;overflow:hidden;isolation:isolate;
  -webkit-mask-image:-webkit-radial-gradient(white,black);
  background:linear-gradient(180deg,#e6f8ff 0%,#8ad4ff 40%,#2c98ff 78%,#0a6cff 100%);
  box-shadow:0 18px 40px rgba(2,110,220,.30)}
.b{position:absolute;border-radius:50%;filter:blur(22px);will-change:transform}
.b1{width:130%;height:70%;left:-15%;bottom:-30%;background:#0a6cff;animation:d1 9s ease-in-out infinite}
.b2{width:70%;height:55%;left:-22%;top:30%;background:#4cc3ff;animation:d2 11s ease-in-out infinite}
.b3{width:60%;height:50%;right:-20%;top:42%;background:#0058f0;opacity:.8;animation:d3 8s ease-in-out infinite}
.b4{width:75%;height:55%;right:-12%;top:-18%;background:#fffdf2;animation:d4 10s ease-in-out infinite}
.b5{width:65%;height:50%;left:-14%;top:-18%;background:#e6f8ff;animation:d2 13s ease-in-out infinite reverse}
@keyframes d1{50%{transform:translate(10%,-12%) scale(1.12)}}
@keyframes d2{50%{transform:translate(18%,-8%) scale(.9)}}
@keyframes d3{50%{transform:translate(-14%,8%) scale(1.1)}}
@keyframes d4{50%{transform:translate(-14%,10%) scale(1.15)}}
.orb img{position:absolute;left:50%;top:50%;height:62%;transform:translate(-50%,-50%);
  filter:drop-shadow(0 4px 10px rgba(0,50,140,.35));z-index:2}
h1{font-size:25px;line-height:1.2;font-weight:800;letter-spacing:-.02em}
.sub{margin-top:8px;font-size:15px;color:var(--mute)}
.rule{width:56px;height:3px;border-radius:3px;margin:18px auto;background:linear-gradient(90deg,var(--gold),var(--gold-hi),var(--gold))}
.arena{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:.02em}
.arena i{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--ink)}
.arena svg{width:20px;height:20px;fill:#fff}
.lead{margin:12px 0 22px;font-size:15px;line-height:1.5;color:var(--mute)}
.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:58px;border-radius:999px;
  background:var(--ink);color:#fff;text-decoration:none;font-weight:700;font-size:17px;
  box-shadow:0 10px 24px rgba(13,13,13,.25);transition:transform .15s}
.go:active{transform:scale(.97)}
.go:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.go svg{width:18px;height:18px;stroke:var(--gold-hi);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.net{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:13px;color:var(--mute)}
.net:before{content:"";width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.18)}
@media (prefers-reduced-motion:reduce){.b{animation:none}}
</style>
</head>
