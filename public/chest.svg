<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" width="100%" height="100%">
  <defs>
    <!-- ================= SHADOWS & GLOW FILTERS ================= -->
    <filter id="dropShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="8" dy="18" stdDeviation="16" flood-color="#071936" flood-opacity="0.32" />
    </filter>

    <filter id="gemOuterGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feFlood flood-color="#48D1FF" flood-opacity="0.85" result="color1" />
      <feComposite in="color1" in2="blur1" operator="in" result="glow1" />
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softHighlight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>

    <!-- ================= ORB-THEMED BLUE GRADIENTS (BODY) ================= -->
    <!-- Front Main Lid & Base Body (Vibrant Azure to Cyan-Blue like Orb 1) -->
    <linearGradient id="orbBodyGrad" x1="15%" y1="5%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#80ECFF" />
      <stop offset="28%" stop-color="#2998FF" />
      <stop offset="70%" stop-color="#0A58CA" />
      <stop offset="100%" stop-color="#06357A" />
    </linearGradient>

    <!-- Side Panel Body (Deep Shadowed Cobalt) -->
    <linearGradient id="orbSideGrad" x1="0%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#1D70D6" />
      <stop offset="50%" stop-color="#094299" />
      <stop offset="100%" stop-color="#042459" />
    </linearGradient>

    <!-- Lid Glossy Specular Sheen (Matches the pearlescent top-right sheen on Orb 1) -->
    <radialGradient id="orbSpecular" cx="38%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#B8F2FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2998FF" stop-opacity="0" />
    </radialGradient>

    <!-- Groove / Plank Divider Gradient -->
    <linearGradient id="grooveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#042459" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#063175" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#031B42" stop-opacity="0.9" />
    </linearGradient>

    <!-- ================= METALLIC FRAME GRADIENTS (ICY PLATINUM & CERULEAN) ================= -->
    <!-- Main Front Frame (Sleek Frosted Silver-Blue to Deep Steel) -->
    <linearGradient id="frameFrontGrad" x1="10%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="18%" stop-color="#E3F6FF" />
      <stop offset="55%" stop-color="#8EC5E8" />
      <stop offset="85%" stop-color="#4A85B5" />
      <stop offset="100%" stop-color="#2D5B85" />
    </linearGradient>

    <!-- Warm Gold-Tinted Royal Trim Alternative? User asked for "in the blue-theme as that my app's orb", so we use luminous icy-cyan + royal chrome with subtle sky-gold speculars -->
    <linearGradient id="frameEdgeHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#BCEBFF" />
      <stop offset="100%" stop-color="#5CA0CE" />
    </linearGradient>

    <!-- Side Frame (Darker Metallic Slate-Blue for 3D Depth) -->
    <linearGradient id="frameSideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8EC5E8" />
      <stop offset="45%" stop-color="#457BA8" />
      <stop offset="100%" stop-color="#1E4266" />
    </linearGradient>

    <!-- Under-lip Shadow Bevel -->
    <linearGradient id="frameUnderBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#183A5E" />
      <stop offset="50%" stop-color="#2B5B8C" />
      <stop offset="100%" stop-color="#102945" />
    </linearGradient>

    <!-- Lock Plate Recessed Slot -->
    <linearGradient id="keyholeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02132E" />
      <stop offset="100%" stop-color="#0A3678" />
    </linearGradient>

    <!-- Rivet / Stud Sphere Gradient -->
    <radialGradient id="rivetGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#B0E2FF" />
      <stop offset="85%" stop-color="#3E74A3" />
      <stop offset="100%" stop-color="#1B3B5C" />
    </radialGradient>

    <!-- ================= CENTER ORB-CRYSTAL GEM GRADIENTS ================= -->
    <linearGradient id="gemHexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#B5F4FF" />
      <stop offset="65%" stop-color="#299CFF" />
      <stop offset="100%" stop-color="#0051B5" />
    </linearGradient>

    <linearGradient id="facetTop" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#DDF9FF" />
      <stop offset="100%" stop-color="#8CE7FF" />
    </linearGradient>

    <linearGradient id="facetCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#75E6FF" />
      <stop offset="50%" stop-color="#1E90FF" />
      <stop offset="100%" stop-color="#0055C4" />
    </linearGradient>

    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8F3FF" />
      <stop offset="100%" stop-color="#33A1FD" />
    </linearGradient>

    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B76D1" />
      <stop offset="100%" stop-color="#053278" />
    </linearGradient>

    <linearGradient id="facetBottomLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48B8FF" />
      <stop offset="100%" stop-color="#0B5ED7" />
    </linearGradient>

    <linearGradient id="facetBottomRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B4DA8" />
      <stop offset="100%" stop-color="#031D4D" />
    </linearGradient>

    <!-- Reusable Rivet Component -->
    <g id="rivet">
      <circle cx="1.5" cy="2.5" r="7.5" fill="#123052" opacity="0.6" />
      <circle cx="0" cy="0" r="7.5" fill="url(#rivetGrad)" />
      <circle cx="-2.2" cy="-2.2" r="2.2" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- Reusable 4-Point Star Sparkle -->
    <g id="sparkle">
      <path d="M 0,-28 C 2,-9 4,-2 28,0 C 4,2 2,9 0,28 C -2,9 -4,2 -28,0 C -4,-2 -2,-9 0,-28 Z" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="6" fill="#FFFFFF" filter="url(#softHighlight)" />
    </g>
  </defs>

  <!-- MASTER CHEST CONTAINER WITH DROP SHADOW -->
  <g filter="url(#dropShadow)">

    <!-- ===================================================== -->
    <!-- 1. LOWER CHEST BASE (3D TAPERED BOX)                  -->
    <!-- ===================================================== -->
    
    <!-- Base Drop Skirt / Bottom Foot Rim -->
    <path d="M 78,548 L 368,520 L 362,542 C 358,554 346,561 332,563 L 106,584 C 91,585 80,575 78,560 Z" fill="url(#frameSideGrad)" />
    <path d="M 78,548 L 368,520 L 364,533 L 78,560 Z" fill="#122E4F" opacity="0.65" />

    <!-- Front Base Outer Metallic Frame -->
    <path d="M 38,325 L 405,292 L 372,526 C 370,536 361,543 351,544 L 84,568 C 73,569 64,561 62,550 Z" fill="url(#frameFrontGrad)" />

    <!-- Right Side Base Outer Metallic Frame -->
    <path d="M 405,292 L 538,318 L 494,502 C 492,510 486,516 478,518 L 372,542 L 405,292 Z" fill="url(#frameSideGrad)" />

    <!-- Front Base Recessed Blue Panel (Orb Theme) -->
    <path d="M 74,364 L 366,337 L 343,512 C 342,518 337,522 331,523 L 106,543 C 99,544 94,539 93,532 Z" fill="url(#orbBodyGrad)" />

    <!-- Front Base Panel Inner Bevel (Bottom/Right Light Rim & Top/Left Shadow) -->
    <path d="M 74,364 L 366,337 L 363,347 L 82,373 L 101,542 L 93,532 Z" fill="#031D4A" opacity="0.6" />
    <path d="M 366,337 L 343,512 C 342,518 337,522 331,523 L 98,543 L 101,537 L 328,517 C 333,516 336,513 337,508 L 360,338 Z" fill="#99ECFF" opacity="0.55" />

    <!-- Front Base Horizontal Plank Grooves -->
    <path d="M 80,418 L 357,392 L 356,399 L 81,425 Z" fill="url(#grooveGrad)" />
    <path d="M 81,425 L 356,399 L 356,402 L 81,428 Z" fill="#70DCFF" opacity="0.35" />

    <path d="M 87,478 L 349,454 L 348,461 L 88,485 Z" fill="url(#grooveGrad)" />
    <path d="M 88,485 L 348,461 L 348,464 L 88,488 Z" fill="#70DCFF" opacity="0.35" />

    <!-- Right Side Recessed Blue Panel -->
    <path d="M 426,348 L 510,364 L 478,486 L 404,504 Z" fill="url(#orbSideGrad)" />
    <!-- Right Side Inner Bevel & Plank Groove -->
    <path d="M 426,348 L 510,364 L 507,372 L 431,357 L 410,502 L 404,504 Z" fill="#021330" opacity="0.75" />
    <path d="M 415,428 L 494,442 L 492,449 L 414,435 Z" fill="#021330" opacity="0.85" />
    <path d="M 414,435 L 492,449 L 491,452 L 413,438 Z" fill="#48B2FF" opacity="0.25" />

    <!-- Crisp Specular Seam Line Between Front and Side Base -->
    <path d="M 405,292 L 372,542" stroke="#E8F9FF" stroke-width="2.5" opacity="0.7" />


    <!-- ===================================================== -->
    <!-- 2. UPPER DOMED LID (VAULTED ARCH)                     -->
    <!-- ===================================================== -->

    <!-- Main Domed Lid Body (Orb Azure Gradient) -->
    <path d="M 28,284 
             C 28,150 86,86 150,78 
             L 476,34 
             C 525,34 565,120 558,282 
             L 398,252 
             Z" fill="url(#orbBodyGrad)" />

    <!-- Orb-Style Soft Pearlescent Specular Glaze on Lid -->
    <path d="M 28,284 
             C 28,150 86,86 150,78 
             L 476,34 
             C 525,34 565,120 558,282 
             L 398,252 
             Z" fill="url(#orbSpecular)" />

    <!-- Lid Horizontal Plank Lines (Perspective Curved) -->
    <!-- Upper Groove -->
    <path d="M 88,128 L 418,86 L 415,93 L 84,135 Z" fill="url(#grooveGrad)" />
    <path d="M 84,135 L 415,93 L 414,96 L 83,138 Z" fill="#99EEFF" opacity="0.4" />

    <!-- Middle Groove -->
    <path d="M 62,188 L 395,148 L 393,156 L 60,196 Z" fill="url(#grooveGrad)" />
    <path d="M 60,196 L 393,156 L 392,159 L 59,199 Z" fill="#99EEFF" opacity="0.45" />

    <!-- Lower Groove -->
    <path d="M 48,246 L 385,212 L 384,219 L 47,253 Z" fill="url(#grooveGrad)" />
    <path d="M 47,253 L 384,219 L 383,222 L 46,256 Z" fill="#99EEFF" opacity="0.35" />

    <!-- Luminous Orb Glint Bubbles on the Blue Lid -->
    <circle cx="128" cy="148" r="24" fill="#FFFFFF" opacity="0.3" filter="url(#softHighlight)" />
    <circle cx="320" cy="122" r="32" fill="#FFFFFF" opacity="0.35" filter="url(#softHighlight)" />
    <ellipse cx="295" cy="82" rx="45" ry="14" transform="rotate(-8 295 82)" fill="#FFFFFF" opacity="0.25" filter="url(#softHighlight)" />


    <!-- ===================================================== -->
    <!-- 3. LID ARCHED RIBS / METALLIC BANDS                   -->
    <!-- ===================================================== -->

    <!-- LEFT OUTER ARCH BAND -->
    <!-- 3D Inner Side Return of Left Band -->
    <path d="M 68,280 C 68,162 118,98 182,78 L 160,76 C 98,94 52,160 52,282 Z" fill="url(#frameSideGrad)" />
    <!-- Front Face of Left Band -->
    <path d="M 16,286 C 16,158 72,88 148,76 L 172,78 C 102,94 56,162 56,282 Z" fill="url(#frameFrontGrad)" />
    <!-- Bright Outer Edge Highlight -->
    <path d="M 16,286 C 16,158 72,88 148,76 L 154,77 C 80,90 24,160 24,285 Z" fill="#FFFFFF" opacity="0.85" />

    <!-- CENTER ARCH BAND (Reinforces the Gem Lock) -->
    <!-- 3D Right Side Bevel of Center Band -->
    <path d="M 262,262 C 266,152 312,84 374,50 L 348,49 C 288,82 246,150 242,264 Z" fill="url(#frameSideGrad)" />
    <!-- Main Face of Center Band -->
    <path d="M 182,270 C 188,154 240,82 314,52 L 356,48 C 288,80 244,152 240,264 Z" fill="url(#frameFrontGrad)" />
    <!-- Center Band Specular Edge -->
    <path d="M 182,270 C 188,154 240,82 314,52 L 322,51 C 250,82 196,154 190,269 Z" fill="#FFFFFF" opacity="0.8" />

    <!-- RIGHT ARCH BAND & 3D SIDE DOME CAP -->
    <!-- Front Thickness Face of Right Arch -->
    <path d="M 366,250 C 370,128 418,46 484,32 L 502,34 C 440,52 396,130 392,252 Z" fill="url(#frameFrontGrad)" />
    <path d="M 366,250 C 370,128 418,46 484,32 L 490,33 C 426,48 378,128 374,251 Z" fill="#FFFFFF" opacity="0.9" />

    <!-- Right Side Broad Arch Frame -->
    <path d="M 392,252 C 396,126 442,38 500,34 C 548,30 572,126 562,284 L 392,252 Z" fill="url(#frameSideGrad)" />

    <!-- Right Side Recessed Arch Panel (Deep Cobalt Window) -->
    <path d="M 454,242 C 458,152 486,98 514,102 C 538,106 546,166 540,258 Z" fill="url(#orbSideGrad)" />
    <!-- Inner Shadow & Highlight Rim of Side Arch Window -->
    <path d="M 454,242 C 458,152 486,98 514,102 C 520,103 525,108 529,116 C 524,110 518,107 512,107 C 486,104 464,156 460,243 Z" fill="#02122C" opacity="0.85" />
    <path d="M 454,242 C 458,152 486,98 514,102 C 538,106 546,166 540,258" fill="none" stroke="#75D5FF" stroke-width="3" opacity="0.45" />


    <!-- ===================================================== -->
    <!-- 4. MID-SECTION HORIZONTAL RIM & LOCK ESCUTCHEON       -->
    <!-- ===================================================== -->

    <!-- Under-Lip Shadow Directly Beneath Mid Rim -->
    <path d="M 20,338 L 410,300 L 560,334 L 552,354 L 406,320 L 38,354 Z" fill="url(#frameUnderBevel)" />

    <!-- Center Shield Lock Plate (Escutcheon) Behind Gem -->
    <!-- 3D Side Thickness of Shield -->
    <path d="M 142,320 L 290,306 L 290,404 C 290,424 278,438 258,448 L 216,468 C 208,472 200,470 194,466 L 156,438 C 146,430 142,418 142,402 Z" fill="url(#frameSideGrad)" />
    <!-- Front Metallic Face of Shield -->
    <path d="M 136,320 L 282,306 L 282,400 C 282,420 270,434 250,444 L 210,464 C 204,467 198,466 192,462 L 152,434 C 140,425 136,412 136,396 Z" fill="url(#frameFrontGrad)" />
    <!-- Shield Bright Bevel Rim -->
    <path d="M 136,320 L 282,306 L 282,400 C 282,420 270,434 250,444 L 210,464 C 204,467 198,466 192,462 L 152,434 C 140,425 136,412 136,396 Z" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.75" />

    <!-- Recessed Pentagonal Keyhole Slot on Shield -->
    <path d="M 186,378 L 238,373 L 238,414 L 212,430 L 186,416 Z" fill="url(#keyholeGrad)" stroke="#8CE7FF" stroke-width="2" opacity="0.9" />
    <path d="M 192,380 L 232,376 L 222,420 L 192,412 Z" fill="#052354" opacity="0.8" />

    <!-- Main Horizontal Mid-Belt — Front Face -->
    <path d="M 4,284 L 412,240 L 412,302 L 12,340 C 6,340 2,336 2,330 Z" fill="url(#frameFrontGrad)" />

    <!-- Main Horizontal Mid-Belt — Right Side Face -->
    <path d="M 412,240 L 582,280 L 576,336 L 412,302 Z" fill="url(#frameSideGrad)" />

    <!-- Top Specular Edge of Mid-Belt (Front & Side) -->
    <path d="M 4,284 L 412,240 L 582,280 L 581,286 L 412,247 L 5,290 Z" fill="#FFFFFF" opacity="0.9" />

    <!-- Bottom Edge Highlight of Mid-Belt -->
    <path d="M 10,337 L 412,299 L 576,333 L 576,336 L 412,302 L 12,340 Z" fill="#B0E4FF" opacity="0.55" />

    <!-- Corner Seam Highlight on Mid-Belt -->
    <path d="M 412,240 L 412,302" stroke="#FFFFFF" stroke-width="3" opacity="0.85" />


    <!-- ===================================================== -->
    <!-- 5. METALLIC RIVETS / STUDS                            -->
    <!-- ===================================================== -->
    <use href="#rivet" x="378" y="272" />
    <use href="#rivet" x="554" y="308" />
    <use href="#rivet" x="62" y="378" />
    <use href="#rivet" x="378" y="348" />
    <use href="#rivet" x="94" y="548" />
    <use href="#rivet" x="352" y="524" />


    <!-- ===================================================== -->
    <!-- 6. LUMINOUS ORB-CRYSTAL HEXAGONAL GEM EMBLEM          -->
    <!-- ===================================================== -->
    <g filter="url(#gemOuterGlow)">
      <!-- Outer Translucent Halo Hexagon -->
      <polygon points="212,190 306,238 306,344 212,396 118,344 118,238" fill="#45C8FF" opacity="0.28" />

      <!-- Main Hexagonal Frame (Crisp White Outer Rim) -->
      <polygon points="212,204 294,246 294,336 212,382 130,336 130,246" fill="url(#gemHexBg)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" />

      <!-- Inner Cut Crystal Facets -->
      <!-- Top Table Facet -->
      <polygon points="180,232 244,232 270,256 248,286 176,286 154,256" fill="url(#facetTop)" />

      <!-- Upper Left Facet -->
      <polygon points="130,246 180,232 154,256 130,336" fill="url(#facetLeft)" opacity="0.85" />

      <!-- Upper Right Facet -->
      <polygon points="294,246 244,232 270,256 294,336" fill="url(#facetRight)" opacity="0.75" />

      <!-- Center Crown Facet -->
      <polygon points="176,286 248,286 238,334 212,356 186,334" fill="url(#facetCenter)" />

      <!-- Mid Left Facet -->
      <polygon points="154,256 176,286 186,334 148,318" fill="url(#facetLeft)" />

      <!-- Mid Right Facet -->
      <polygon points="270,256 248,286 238,334 276,318" fill="url(#facetRight)" />

      <!-- Bottom Left Pavilion Facet -->
      <polygon points="148,318 186,334 212,356 212,382 130,336" fill="url(#facetBottomLeft)" />

      <!-- Bottom Right Pavilion Facet -->
      <polygon points="276,318 238,334 212,356 212,382 294,336" fill="url(#facetBottomRight)" />

      <!-- Crisp White Facet Ridge Lines -->
      <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
        <polygon points="154,256 180,232 244,232 270,256 248,286 176,286" />
        <polyline points="154,256 148,318 186,334 212,356 238,334 276,318 270,256" />
        <line x1="176" y1="286" x2="186" y2="334" />
        <line x1="248" y1="286" x2="238" y2="334" />
        <line x1="212" y1="356" x2="212" y2="380" />
        <line x1="148" y1="318" x2="132" y2="334" />
        <line x1="276" y1="318" x2="292" y2="334" />
      </g>

      <!-- Glossy Pill Highlight on Top Gem Table (Matches Reference Image 1 + Orb Gloss) -->
      <ellipse cx="198" cy="256" rx="24" ry="11" transform="rotate(-14 198 256)" fill="#FFFFFF" opacity="0.95" />
      <ellipse cx="236" cy="270" rx="8" ry="4" transform="rotate(-14 236 270)" fill="#FFFFFF" opacity="0.7" />
    </g>


    <!-- ===================================================== -->
    <!-- 7. STARBURST SPARKLES & AMBIENT LIGHT FLARES          -->
    <!-- ===================================================== -->
    <!-- Top Right Arch Sparkle -->
    <use href="#sparkle" x="432" y="56" transform="scale(0.95)" />
    <use href="#sparkle" x="410" y="53" transform="translate(410,53) scale(0.85) translate(-410,-53)" />

    <!-- Upper Left Arch Sparkle -->
    <g transform="translate(92, 138) scale(0.75)">
      <use href="#sparkle" x="0" y="0" />
    </g>

    <!-- Gem Top-Left Diagonal Star Flare -->
    <g transform="translate(140, 218) rotate(-32) scale(1.15)">
      <path d="M 0,-38 C 2.5,-10 5,-2.5 38,0 C 5,2.5 2.5,10 0,38 C -2.5,10 -5,2.5 -38,0 C -5,-2.5 -2.5,-10 0,-38 Z" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="8" fill="#FFFFFF" filter="url(#softHighlight)" />
    </g>

    <!-- Gem Top-Right Diagonal Star Flare -->
    <g transform="translate(278, 212) rotate(28) scale(1.05)">
      <path d="M 0,-36 C 2.5,-10 5,-2.5 36,0 C 5,2.5 2.5,10 0,36 C -2.5,10 -5,2.5 -36,0 C -5,-2.5 -2.5,-10 0,-36 Z" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="7" fill="#FFFFFF" filter="url(#softHighlight)" />
    </g>

    <!-- Floating Micro-Orbs / Light Motes for Polish -->
    <circle cx="338" cy="268" r="4" fill="#FFFFFF" opacity="0.9" filter="url(#softHighlight)" />
    <circle cx="106" cy="304" r="3.5" fill="#9EEBFF" opacity="0.85" />
    <circle cx="212" cy="416" r="3" fill="#9EEBFF" opacity="0.75" />

  </g>
</svg>