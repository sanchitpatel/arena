<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 220" width="180" height="220" fill="none">
  <defs>
    <!-- Bronze / Rose-Copper Metallic Gradients -->
    <linearGradient id="bronze-ring-outer" x1="30" y1="55" x2="150" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE9DC" />
      <stop offset="35%" stop-color="#F2B89B" />
      <stop offset="70%" stop-color="#C97B59" />
      <stop offset="100%" stop-color="#F7CCB5" />
    </linearGradient>

    <linearGradient id="bronze-ring-inner" x1="150" y1="175" x2="30" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFEDE3" />
      <stop offset="50%" stop-color="#B36544" />
      <stop offset="100%" stop-color="#FFF4ED" />
    </linearGradient>

    <linearGradient id="bronze-crown" x1="65" y1="18" x2="115" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE2D1" />
      <stop offset="45%" stop-color="#E59E7D" />
      <stop offset="100%" stop-color="#B06241" />
    </linearGradient>

    <linearGradient id="bronze-badge" x1="70" y1="154" x2="110" y2="198" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE8DA" />
      <stop offset="45%" stop-color="#EBB092" />
      <stop offset="100%" stop-color="#BD6F4D" />
    </linearGradient>

    <filter id="bronze-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#7C3F23" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Crown -->
  <g filter="url(#bronze-shadow)">
    <path d="M70 49 L65 29 L80 38 L90 23 L100 38 L115 29 L110 49 C99 51.5, 81 51.5, 70 49 Z" fill="url(#bronze-crown)" />
    <circle cx="64.5" cy="27.5" r="2.8" fill="#FAD2BC" />
    <circle cx="90" cy="21.5" r="3.4" fill="#FFE6D6" />
    <circle cx="115.5" cy="27.5" r="2.8" fill="#E39A78" />
    <path d="M71 48 C81 50, 99 50, 109 48" stroke="#FFE9DC" stroke-width="1.3" stroke-linecap="round" />
  </g>

  <!-- Main Circular Frame (Transparent Center) -->
  <g filter="url(#bronze-shadow)">
    <circle cx="90" cy="115" r="54" stroke="url(#bronze-ring-outer)" stroke-width="8.5" />
    <circle cx="90" cy="115" r="50.5" stroke="url(#bronze-ring-inner)" stroke-width="2" />
  </g>

  <!-- Bottom Rank Badge -->
  <g filter="url(#bronze-shadow)">
    <circle cx="90" cy="174" r="20" fill="url(#bronze-badge)" stroke="#FFE8DB" stroke-width="2" />
    <!-- Remove <text> if you want a blank badge -->
    <text x="90" y="182" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="800" fill="#231712">3</text>
  </g>
</svg>